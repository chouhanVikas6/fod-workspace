syntax = "proto3";
package zoid.common;

enum MissionStatus {
    MISSION_STATUS_UNSPECIFIED = 0;
    ACTIVE = 1;
    INACTIVE = 2;
    TERMINATED = 3;
}

enum MissionScanStatus {
    SCAN_STATUS_UNSPECIFIED = 0;
    PLAY = 1;
    PAUSE = 2;
}

enum FodGroupStatus {
    GROUP_STATUS_UNSPECIFIED = 0;
    NEW = 1;
    ACCEPTED = 2;
    REJECTED = 3;
    CLEARED = 4;
}

enum ClearedFodStatus {
    CLEARED_STATUS_UNSPECIFIED = 0;
    FOUND = 1;
    NOT_FOUND = 2;
    FALSE_POSITIVE = 3;
}

message LatLon {
    double lat = 1;
    double lon = 2;
    double sd = 3;
}

message PaginationRequest {
    int32 page = 1;
    int32 limit = 2;
}

message PaginationMeta {
    int32 current_page = 1;
    int32 page_size = 2;
    int64 total_items = 3;
    int32 total_pages = 4;
}
