[package]
name = "fod-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures = "0.3.34"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
rand = "0.10.2"
prost = "0.13"
tonic = { version = "0.12", features = ["gzip"] }
proto-defination = { path = "../../fod-backend/crates/proto-defination" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
rust_socketio = { version = "0.6.0", features = ["async"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
socketioxide = { version = "0.18.6", features = ["state"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }
