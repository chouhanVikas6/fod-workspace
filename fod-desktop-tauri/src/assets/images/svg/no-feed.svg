<svg
  width="100%"
  height="100%"
  viewBox="0 0 200 110"
  xmlns="http://www.w3.org/2000/svg"
  style="background-color: #e0ffe0; border-radius: 8px;"
>
  <!-- Sky Background -->
  <rect width="200" height="50" fill="#a0e0ff" />

  <!-- Grass -->
  <rect y="80" width="200" height="80" fill="#88cc88" />

  <!-- Tree Trunks -->
  <rect x="50" y="60" width="10" height="30" fill="#8b5a2b" />
  <rect x="140" y="60" width="10" height="20" fill="#8b5a2b" />

  <!-- Tree Crowns -->
  <circle cx="55" cy="55" r="20" fill="#4caf50" />
  <circle cx="145" cy="55" r="15" fill="#4caf50" />

  <!-- Text -->
  <text x="100" y="100" text-anchor="middle" font-size="16" fill="#555">
    No Camera Feed
  </text>
</svg>
